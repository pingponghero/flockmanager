# Flutter Launcher Icons Configuration
# Run: dart run flutter_launcher_icons

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

  # iOS specific
  remove_alpha_ios: true

  # Android adaptive icon
  adaptive_icon_background: "#F5F0E6"  # Cream background
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

  # Web favicon
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#F5F0E6"
    theme_color: "#6B4423"

  # Windows
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48

  # macOS
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

# App Icon Variants:
# ------------------
# Primary: app_icon.png (brown hen on cream) - used for all platforms
# Variants available in assets/icons/:
#   - app_icon_barn_red.png (barn red hen on cream)
#   - app_icon_sage.png (sage green hen on cream)
#   - app_icon_teal.png (teal hen on cream)
#   - app_icon_terracotta.png (terracotta hen on cream)
#   - app_icon_light.png (brown hen on cream - same as primary)
