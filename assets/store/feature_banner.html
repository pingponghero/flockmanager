<!DOCTYPE html>
<html>
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .banner {
          width: 1024px;
          height: 500px;
          background: linear-gradient(135deg, #FFF8F0 0%, #F5E6D3 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: system-ui, -apple-system, sans-serif;
          gap: 48px;
          padding: 64px;
        }
        .icon {
          width: 280px;
          height: 280px;
        }
        .icon img {
          width: 100%;
          height: 100%;
          object-fit: contain;
        }
        .text {
          text-align: left;
        }
        .title {
          font-size: 72px;
          font-weight: 700;
          color: #8B2E2E;
          margin-bottom: 16px;
        }
        .tagline {
          font-size: 32px;
          color: #5C4033;
        }
    </style>
</head>
<body>
<div class="banner">
    <div class="icon"><img src="../icons/cute_hen_barn_red_icon.png" alt="Flock Manager"></div>
    <div class="text">
        <div class="title">Flock Manager</div>
        <div class="tagline">Track your flock. No subscriptions.</div>
    </div>
</div>
</body>
</html>
